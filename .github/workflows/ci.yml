name: CI

# Nothing verified the test suite on push before this workflow existed: the
# backend tests and the frontend build only ever ran on a dev machine.
#
# The Unity PlayMode probes (ISL-3D Avatar/Assets/Tests) are deliberately not
# here: they need a Unity editor plus a licence in batch mode, so they stay a
# local check. Everything that can run headless does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 3.12 for the same reason as the Dockerfile's base image: the pinned
      # numpy (2.5.4) requires >=3.12, so a 3.11 interpreter cannot resolve
      # the lock set at all. This is the version the suite is green on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Same split as backend/Dockerfile: CPU-only torch first, otherwise the
      # CUDA wheel (2.5 GB) is pulled for nothing.
      - name: Install CPU-only torch
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install requirements
        run: pip install --no-cache-dir -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check the documented install resolves
        run: pip check

      # METEOR needs the WordNet corpus (a separate download); without it
      # tests/test_eval.py skips that one metric instead of scoring it.
      - name: Download NLTK WordNet corpus
        run: python -m nltk.downloader -q wordnet omw-1.4

      # conftest.py pins DATA_DIR at tests/fixtures and warms no models, so
      # this runs offline: no T5 weights, no FAISS index, no PostgreSQL.
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 22: vitest 5 needs >=22.12 and jsdom 30 needs >=22.22.2,
          # and 24 is the runtime the suite is green on locally.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, not install: package-lock.json is committed, so the lock is
      # the resolution (backend/Dockerfile still uses `npm install`).
      - run: npm ci

      - name: Lint
        run: npm run lint

      # Playback/coverage/reconnect logic has no renderer or network
      # dependency, so it runs here in jsdom.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
