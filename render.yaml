services:
  - type: web
    name: isl-avatar-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATA_DIR
        value: /opt/render/project/src/backend
      - key: PYTHONUNBUFFERED
        value: "1"
    rootDir: backend
