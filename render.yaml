services:
  - type: web
    name: isl-avatar-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # rootDir=backend so only backend/ is present; paths.py falls back to
      # backend-local landmarks/sentence_mapping/dataset.csv
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ISL_WARMUP_MODELS
        value: "1"
    rootDir: backend
